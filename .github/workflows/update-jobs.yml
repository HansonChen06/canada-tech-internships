name: Update jobs

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Refresh listings
        run: PYTHONPATH=src python -m canada_jobs.update
      - name: Commit changed data
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/jobs.json data/jobs.csv
          git commit -m "chore: daily jobs update"
          git push

